<p>
  Omarchy内置了简单的提醒功能：设定倒计时，附上一条消息。按<code
    >Super + Ctrl + R</code
  >设置提醒，<code>Super + Ctrl + Alt + R</code>查看全部提醒，<code
    >Super + Ctrl + Shift + R</code
  >清除全部。这些也都可以在<em>Trigger &gt; Reminder</em
  >中操作，或者使用命令行：<code>omarchy reminder 7 'Tea ready'</code>。
</p>
